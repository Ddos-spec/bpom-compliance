name: Build Tera Rust Fanatic Single Binary

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Cross-Compile Single Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: tera-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: tera-windows-x64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/tera-backend

      - name: Install Musl Tools (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build Single Binary (Release LTO Fat)
        working-directory: crates/tera-backend
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            crates/tera-backend/target/${{ matrix.target }}/release/tera-backend
            crates/tera-backend/target/${{ matrix.target }}/release/tera-backend.exe
          if-no-files-found: error
